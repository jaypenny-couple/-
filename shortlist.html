<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>缺貨登記</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            justify-content: space-between;
        }
        .form-container, .result-container {
            width: 45%;
        }
        h1, h2 {
            text-align: center;
            color: #333;
        }
        form {
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 5px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        select, input[type="text"], input[type="submit"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background-color: #45a049;
        }
        input[type="submit"]:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        #result {
            background-color: #f0f0f0;
            padding: 20px;
            border-radius: 5px;
            margin-top: 20px;
        }
        .result-item {
            background-color: white;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
            position: relative;
            border-left: 4px solid #4CAF50;
        }
        .delete-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background-color: #ff4d4d;
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 12px;
            cursor: pointer;
        }
        .delete-btn:hover {
            background-color: #ff3333;
        }
        .status {
            text-align: center;
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }
        .status.connected {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .status.loading {
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }
        .timestamp {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>缺貨登記</h1>
        <div id="status" class="status loading">正在連接 Firebase...</div>
        <form id="stockForm">
            <label for="vendor">廠商:</label>
            <select id="vendor" name="vendor" required>
                <option value="">請選擇廠商</option>
                <option value="肯邦">肯邦</option>
                <option value="fiole">fiole</option>
                <option value="蕾娜塔">蕾娜塔</option>
                <option value="明佳麗">明佳麗</option>
                <option value="TOB">TOB</option>
                <option value="萊肯">萊肯</option>
                <option value="中野">中野</option>
                <option value="寶齡">寶齡</option>
                <option value="桑多麗">桑多麗</option>
                <option value="蘊洛">蘊洛</option>
                <option value="其他">其他</option>
            </select>

            <label for="item">品項:</label>
            <input type="text" id="item" name="item" required placeholder="請輸入缺貨品項">

            <input type="submit" id="submitBtn" value="提交登記">
        </form>
    </div>
    
    <div class="result-container">
        <h2>登記結果</h2>
        <div id="result">
            <div class="status loading">載入中...</div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        // Import Firebase modules
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getDatabase, ref, push, onValue, remove } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

        // Firebase 配置
        const firebaseConfig = {
            apiKey: "AIzaSyAkNgKjtbDiD_1l4wgvt9GPPMuGQouVGgA",
            authDomain: "restocking-list.firebaseapp.com",
            databaseURL: "https://restocking-list-default-rtdb.firebaseio.com",
            projectId: "restocking-list",
            storageBucket: "restocking-list.firebasestorage.app",
            messagingSenderId: "1070128829792",
            appId: "1:1070128829792:web:2ee97f72d545ddd3193a05",
            measurementId: "G-BKXQ46K8HV"
        };

        // 檢查 Firebase 配置並初始化
        try {
            // 初始化 Firebase
            const app = initializeApp(firebaseConfig);
            const database = getDatabase(app);
            const stockRef = ref(database, 'stockItems');

            let isConnected = false;

            // 監聽資料變化
            onValue(stockRef, (snapshot) => {
                if (!isConnected) {
                    document.getElementById('status').innerHTML = '<div class="status connected">✓ 已連接到 Firebase</div>';
                    isConnected = true;
                }
                
                const data = snapshot.val();
                displayResults(data);
            }, (error) => {
                document.getElementById('status').innerHTML = '<div class="status error">❌ Firebase 連接失敗: ' + error.message + '</div>';
                console.error('Firebase error:', error);
            });

            // 表單提交
            document.getElementById('stockForm').addEventListener('submit', function(e) {
                e.preventDefault();
                
                const vendor = document.getElementById('vendor').value;
                const item = document.getElementById('item').value;
                const submitBtn = document.getElementById('submitBtn');
                
                // 停用按鈕防止重複提交
                submitBtn.disabled = true;
                submitBtn.value = '提交中...';
                
                // 新增資料到 Firebase
                const newItem = {
                    vendor: vendor,
                    item: item,
                    timestamp: Date.now(),
                    date: new Date().toLocaleString('zh-TW')
                };
                
                push(stockRef, newItem)
                    .then(() => {
                        // 清空表單
                        document.getElementById('vendor').value = '';
                        document.getElementById('item').value = '';
                        
                        // 重新啟用按鈕
                        submitBtn.disabled = false;
                        submitBtn.value = '提交登記';
                    })
                    .catch((error) => {
                        console.error('Error adding document: ', error);
                        alert('提交失敗，請稍後再試');
                        
                        // 重新啟用按鈕
                        submitBtn.disabled = false;
                        submitBtn.value = '提交登記';
                    });
            });

            // 顯示結果
            function displayResults(data) {
                const resultDiv = document.getElementById('result');
                
                if (!data) {
                    resultDiv.innerHTML = '<div style="text-align: center; color: #666;">暫無缺貨登記</div>';
                    return;
                }
                
                // 轉換為陣列並按時間排序（最新的在前）
                const items = Object.keys(data).map(key => ({
                    id: key,
                    ...data[key]
                })).sort((a, b) => b.timestamp - a.timestamp);
                
                resultDiv.innerHTML = '';
                
                items.forEach(item => {
                    const resultItem = document.createElement('div');
                    resultItem.className = 'result-item';
                    resultItem.innerHTML = `
                        <p><strong>廠商:</strong> ${item.vendor}</p>
                        <p><strong>品項:</strong> ${item.item}</p>
                        <div class="timestamp">登記時間: ${item.date}</div>
                        <button class="delete-btn" onclick="deleteResult('${item.id}')">×</button>
                    `;
                    resultDiv.appendChild(resultItem);
                });
            }

            // 刪除項目
            window.deleteResult = function(id) {
                if (confirm('確定要刪除此項目嗎？')) {
                    const itemRef = ref(database, `stockItems/${id}`);
                    remove(itemRef)
                        .then(() => {
                            console.log('Item deleted successfully');
                        })
                        .catch((error) => {
                            console.error('Error deleting item:', error);
                            alert('刪除失敗，請稍後再試');
                        });
                }
            };
        } catch (error) {
            document.getElementById('status').innerHTML = '<div class="status error">❌ Firebase 初始化失敗: ' + error.message + '</div>';
            console.error('Firebase initialization error:', error);
        }
    </script>
</body>
</html>
