<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>顧客商品預訂登記</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #ffffff;
            font-weight: 300;
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            margin-bottom: 20px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            padding: 0 10px;
        }

        h2 {
            text-align: center;
            color: #ffffff;
            font-weight: 300;
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            margin: 30px 0 15px 0;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .form-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 100%;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-group {
            position: relative;
            width: 100%;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e8ed;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #ffffff;
            box-sizing: border-box;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            transform: translateY(-2px);
        }

        .submit-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .table-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            overflow-x: auto;
            width: 100%;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #ffffff;
            padding: 15px 10px;
            text-align: left;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: relative;
            white-space: nowrap;
        }

        .sortable {
            cursor: pointer;
            user-select: none;
            transition: background-color 0.3s ease;
        }

        .sortable:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .sortable::after {
            content: "↕";
            position: absolute;
            right: 5px;
            opacity: 0.6;
            font-size: 10px;
        }

        .sortable.asc::after {
            content: "↑";
            opacity: 1;
        }

        .sortable.desc::after {
            content: "↓";
            opacity: 1;
        }

        td {
            padding: 12px 8px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 13px;
            color: #555;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 150px;
        }

        tr:nth-child(even) {
            background-color: rgba(102, 126, 234, 0.02);
        }

        tr:hover {
            background-color: rgba(102, 126, 234, 0.05);
            transition: all 0.2s ease;
        }

        .delete-btn {
            background: linear-gradient(135deg, #ff6b6b, #ee5a52);
            border: none;
            padding: 6px 10px;
            border-radius: 8px;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 11px;
            white-space: nowrap;
        }

        .delete-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.3);
        }

        .confirm-delete-btn {
            background: linear-gradient(135deg, #dc3545, #c82333);
            border: none;
            padding: 4px 8px;
            border-radius: 6px;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 10px;
            margin-right: 3px;
            white-space: nowrap;
        }

        .confirm-delete-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(220, 53, 69, 0.4);
        }

        .cancel-delete-btn {
            background: linear-gradient(135deg, #6c757d, #5a6268);
            border: none;
            padding: 4px 8px;
            border-radius: 6px;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 10px;
            white-space: nowrap;
        }

        .cancel-delete-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(108, 117, 125, 0.4);
        }

        .delete-actions {
            display: flex;
            gap: 3px;
            align-items: center;
            flex-wrap: wrap;
        }

        .edit-date {
            width: 120px;
            padding: 6px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-size: 11px;
            transition: all 0.3s ease;
        }

        .edit-date:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.1);
        }

        .quantity-display {
            display: inline-block;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 3px 8px;
            border-radius: 15px;
            font-size: 11px;
            font-weight: 600;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .stat-number {
            font-size: clamp(1.5rem, 4vw, 2rem);
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: clamp(0.7rem, 2vw, 0.9rem);
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* 手機版本優化 */
        @media (max-width: 768px) {
            body {
                padding: 5px;
            }
            
            .container {
                padding: 5px;
            }
            
            .form-card {
                padding: 15px;
                margin-bottom: 20px;
            }
            
            .form-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            
            input, select {
                padding: 10px;
                font-size: 16px; /* 防止iOS縮放 */
            }
            
            .submit-btn {
                padding: 15px;
                font-size: 16px;
            }
            
            table {
                min-width: 600px;
                font-size: 11px;
            }
            
            th {
                padding: 10px 6px;
                font-size: 10px;
            }
            
            td {
                padding: 8px 4px;
                font-size: 11px;
                max-width: 80px;
            }
            
            .edit-date {
                width: 100px;
                padding: 4px;
                font-size: 10px;
            }
            
            .delete-btn {
                padding: 4px 6px;
                font-size: 9px;
            }
            
            .confirm-delete-btn, .cancel-delete-btn {
                padding: 3px 5px;
                font-size: 8px;
            }
            
            .stats-container {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }
            
            .stat-card {
                padding: 10px;
            }
        }

        /* 超小屏幕優化 */
        @media (max-width: 480px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            
            table {
                min-width: 500px;
            }
            
            th, td {
                padding: 6px 3px;
                font-size: 10px;
            }
            
            .edit-date {
                width: 80px;
            }
        }

        /* 橫向手機優化 */
        @media (max-width: 896px) and (orientation: landscape) {
            body {
                padding: 5px;
            }
            
            h1 {
                font-size: 1.8rem;
                margin-bottom: 15px;
            }
            
            .stats-container {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>顧客商品預訂登記系統</h1>
        
        <div class="stats-container" id="statsContainer">
            <div class="stat-card">
                <div class="stat-number" id="totalReservations">0</div>
                <div class="stat-label">總預訂數</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="todayReservations">0</div>
                <div class="stat-label">今日預訂</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalQuantity">0</div>
                <div class="stat-label">總數量</div>
            </div>
        </div>

        <div class="form-card">
            <form id="reservationForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="reservationDate">預訂日期</label>
                        <input type="date" id="reservationDate" name="reservationDate" required>
                    </div>
                    <div class="form-group">
                        <label for="customerName">顧客姓名</label>
                        <input type="text" id="customerName" name="customerName" required>
                    </div>
                    <div class="form-group">
                        <label for="contactPlatform">聯絡平台</label>
                        <select id="contactPlatform" name="contactPlatform" required>
                            <option value="" disabled selected>請選擇</option>
                            <option value="臉書">臉書</option>
                            <option value="IG">IG</option>
                            <option value="Google">Google</option>
                            <option value="脆">脆</option>
                            <option value="Line@">Line@</option>
                            <option value="電話">電話</option>
                            <option value="臨店">臨店</option>
                            <option value="其他">其他</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="product">預訂商品</label>
                        <input type="text" id="product" name="product" required>
                    </div>
                    <div class="form-group">
                        <label for="quantity">數量</label>
                        <input type="number" id="quantity" name="quantity" min="1" value="1" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">聯絡電話</label>
                        <input type="tel" id="phone" name="phone" required>
                    </div>
                </div>
                <button type="submit" class="submit-btn">新增預訂</button>
            </form>
        </div>

        <h2>預訂記錄</h2>
        <div class="table-container">
            <table id="reservationTable">
                <thead>
                    <tr>
                        <th class="sortable" data-column="reservationDate">預訂日期</th>
                        <th>顧客姓名</th>
                        <th class="sortable" data-column="contactPlatform">聯絡平台</th>
                        <th class="sortable" data-column="product">預訂商品</th>
                        <th>數量</th>
                        <th>聯絡電話</th>
                        <th>取貨日期</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="reservationList">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let reservations = JSON.parse(localStorage.getItem('reservations') || '[]');
            let sortColumn = '';
            let sortDirection = 'asc';

            // 設定日期輸入框的默認值和限制
            function initializeDateInputs() {
                const today = new Date();
                const todayString = today.toISOString().split('T')[0];
                
                // 設定預訂日期的默認值為今天
                document.getElementById('reservationDate').value = todayString;
                
                // 設定日期範圍（可以根據需要調整）
                const maxDate = new Date();
                maxDate.setMonth(maxDate.getMonth() + 3); // 3個月後
                const maxDateString = maxDate.toISOString().split('T')[0];
                
                // 允許選擇從3個月前到3個月後的日期
                const minDate = new Date();
                minDate.setMonth(minDate.getMonth() - 3); // 3個月前
                const minDateString = minDate.toISOString().split('T')[0];
                
                document.getElementById('reservationDate').setAttribute('min', minDateString);
                document.getElementById('reservationDate').setAttribute('max', maxDateString);
            }

            // 保存數據
            function saveReservations() {
                localStorage.setItem('reservations', JSON.stringify(reservations));
            }

            // 表單提交
            document.getElementById('reservationForm').addEventListener('submit', (e) => {
                e.preventDefault();

                const reservationDate = document.getElementById('reservationDate').value;
                const reservation = {
                    id: Date.now(),
                    reservationDate: reservationDate,
                    customerName: document.getElementById('customerName').value,
                    contactPlatform: document.getElementById('contactPlatform').value,
                    product: document.getElementById('product').value,
                    quantity: parseInt(document.getElementById('quantity').value),
                    phone: document.getElementById('phone').value,
                    pickupDate: reservationDate
                };

                reservations.push(reservation);
                saveReservations();
                renderReservations();
                updateStats();
                e.target.reset();
                
                // 重設日期為今天
                const today = new Date().toISOString().split('T')[0];
                document.getElementById('reservationDate').value = today;
                document.getElementById('quantity').value = 1;
            });

            // 排序功能
            function sortReservations(column) {
                if (sortColumn === column) {
                    sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
                } else {
                    sortColumn = column;
                    sortDirection = 'asc';
                }

                reservations.sort((a, b) => {
                    let aVal = a[column];
                    let bVal = b[column];
                    
                    if (column === 'reservationDate') {
                        aVal = new Date(aVal);
                        bVal = new Date(bVal);
                    } else if (typeof aVal === 'string') {
                        aVal = aVal.toLowerCase();
                        bVal = bVal.toLowerCase();
                    }

                    if (sortDirection === 'asc') {
                        return aVal > bVal ? 1 : -1;
                    } else {
                        return aVal < bVal ? 1 : -1;
                    }
                });

                updateSortHeaders();
                renderReservations();
            }

            // 更新排序標題
            function updateSortHeaders() {
                document.querySelectorAll('.sortable').forEach(th => {
                    th.classList.remove('asc', 'desc');
                    if (th.dataset.column === sortColumn) {
                        th.classList.add(sortDirection);
                    }
                });
            }

            // 統計數據
            function updateStats() {
                const today = new Date().toISOString().split('T')[0];
                const todayReservations = reservations.filter(r => r.reservationDate === today).length;
                const totalQuantity = reservations.reduce((sum, r) => sum + (r.quantity || 1), 0);

                document.getElementById('totalReservations').textContent = reservations.length;
                document.getElementById('todayReservations').textContent = todayReservations;
                document.getElementById('totalQuantity').textContent = totalQuantity;
            }

            // 渲染預訂記錄
            function renderReservations() {
                const reservationList = document.getElementById('reservationList');
                reservationList.innerHTML = '';

                reservations.forEach(reservation => {
                    const row = document.createElement('tr');
                    const maxDate = new Date();
                    maxDate.setMonth(maxDate.getMonth() + 3);
                    const maxDateString = maxDate.toISOString().split('T')[0];
                    
                    // 取貨日期的最小值應該是預訂日期，而不是今天
                    const minPickupDate = reservation.reservationDate;
                    
                    row.innerHTML = `
                        <td>${reservation.reservationDate}</td>
                        <td>${reservation.customerName}</td>
                        <td>${reservation.contactPlatform}</td>
                        <td>${reservation.product}</td>
                        <td><span class="quantity-display">${reservation.quantity || 1}</span></td>
                        <td>${reservation.phone}</td>
                        <td>
                            <input type="date" class="edit-date" value="${reservation.pickupDate}" 
                                   min="${minPickupDate}" max="${maxDateString}" 
                                   data-id="${reservation.id}">
                        </td>
                        <td>
                            <div class="delete-actions">
                                <button class="delete-btn" data-id="${reservation.id}">刪除</button>
                                <div class="confirm-actions" style="display: none;" data-id="${reservation.id}">
                                    <button class="confirm-delete-btn" data-id="${reservation.id}">確認刪除?</button>
                                    <button class="cancel-delete-btn" data-id="${reservation.id}">取消</button>
                                </div>
                            </div>
                        </td>
                    `;
                    reservationList.appendChild(row);
                });

                // 日期編輯事件
                document.querySelectorAll('.edit-date').forEach(input => {
                    input.addEventListener('change', (e) => {
                        const id = parseInt(e.target.getAttribute('data-id'));
                        const newPickupDate = e.target.value;
                        const reservation = reservations.find(res => res.id === id);
                        if (reservation) {
                            reservation.pickupDate = newPickupDate;
                            saveReservations();
                        }
                    });
                });

                // 刪除按鈕事件
                document.querySelectorAll('.delete-btn').forEach(button => {
                    button.addEventListener('click', (e) => {
                        const id = button.getAttribute('data-id');
                        // 隱藏刪除按鈕，顯示確認按鈕
                        button.style.display = 'none';
                        const confirmActions = button.parentElement.querySelector(`.confirm-actions[data-id="${id}"]`);
                        confirmActions.style.display = 'flex';
                    });
                });

                // 確認刪除按鈕事件
                document.querySelectorAll('.confirm-delete-btn').forEach(button => {
                    button.addEventListener('click', () => {
                        const id = parseInt(button.getAttribute('data-id'));
                        reservations = reservations.filter(res => res.id !== id);
                        saveReservations();
                        renderReservations();
                        updateStats();
                    });
                });

                // 取消刪除按鈕事件
                document.querySelectorAll('.cancel-delete-btn').forEach(button => {
                    button.addEventListener('click', () => {
                        const id = button.getAttribute('data-id');
                        // 隱藏確認按鈕，顯示刪除按鈕
                        const confirmActions = button.parentElement;
                        const deleteBtn = confirmActions.parentElement.querySelector(`.delete-btn[data-id="${id}"]`);
                        confirmActions.style.display = 'none';
                        deleteBtn.style.display = 'inline-block';
                    });
                });
            }

            // 排序事件監聽
            document.querySelectorAll('.sortable').forEach(th => {
                th.addEventListener('click', () => {
                    sortReservations(th.dataset.column);
                });
            });

            // 初始化
            initializeDateInputs();
            renderReservations();
            updateStats();
        });
    </script>
</body>
</html>
