<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>顧客商品預訂登記</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #ffffff;
            font-weight: 300;
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            margin-bottom: 20px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            padding: 0 10px;
        }

        h2 {
            text-align: center;
            color: #ffffff;
            font-weight: 300;
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            margin: 30px 0 15px 0;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .sync-status {
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .sync-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
            transition: all 0.3s ease;
        }

        .sync-indicator.connected {
            background-color: #4CAF50;
            animation: pulse 2s infinite;
        }

        .sync-indicator.disconnected {
            background-color: #f44336;
        }

        .sync-indicator.syncing {
            background-color: #ff9800;
            animation: spin 1s linear infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .form-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 100%;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-group {
            position: relative;
            width: 100%;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e8ed;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #ffffff;
            box-sizing: border-box;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            transform: translateY(-2px);
        }

        .submit-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .table-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            overflow-x: auto;
            width: 100%;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #ffffff;
            padding: 15px 10px;
            text-align: left;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: relative;
            white-space: nowrap;
        }

        .sortable {
            cursor: pointer;
            user-select: none;
            transition: background-color 0.3s ease;
        }

        .sortable:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .sortable::after {
            content: "↕";
            position: absolute;
            right: 5px;
            opacity: 0.6;
            font-size: 10px;
        }

        .sortable.asc::after {
            content: "↑";
            opacity: 1;
        }

        .sortable.desc::after {
            content: "↓";
            opacity: 1;
        }

        td {
            padding: 12px 8px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 13px;
            color: #555;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 150px;
        }

        tr:nth-child(even) {
            background-color: rgba(102, 126, 234, 0.02);
        }

        tr:hover {
            background-color: rgba(102, 126, 234, 0.05);
            transition: all 0.2s ease;
        }

        .delete-btn {
            background: linear-gradient(135deg, #ff6b6b, #ee5a52);
            border: none;
            padding: 6px 10px;
            border-radius: 8px;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 11px;
            white-space: nowrap;
        }

        .delete-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.3);
        }

        .delete-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .confirm-delete-btn {
            background: linear-gradient(135deg, #dc3545, #c82333);
            border: none;
            padding: 4px 8px;
            border-radius: 6px;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 10px;
            margin-right: 3px;
            white-space: nowrap;
        }

        .confirm-delete-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(220, 53, 69, 0.4);
        }

        .cancel-delete-btn {
            background: linear-gradient(135deg, #6c757d, #5a6268);
            border: none;
            padding: 4px 8px;
            border-radius: 6px;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 10px;
            white-space: nowrap;
        }

        .cancel-delete-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(108, 117, 125, 0.4);
        }

        .delete-actions {
            display: flex;
            gap: 3px;
            align-items: center;
            flex-wrap: wrap;
        }

        .edit-date {
            width: 120px;
            padding: 6px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-size: 11px;
            transition: all 0.3s ease;
        }

        .edit-date:focus:not(:disabled) {
            border-color: #667eea;
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.1);
        }

        .edit-date:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .quantity-display {
            display: inline-block;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 3px 8px;
            border-radius: 15px;
            font-size: 11px;
            font-weight: 600;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .stat-number {
            font-size: clamp(1.5rem, 4vw, 2rem);
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: clamp(0.7rem, 2vw, 0.9rem);
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .loading {
            text-align: center;
            color: white;
            padding: 20px;
            font-size: 16px;
        }

        .error-message {
            background: rgba(244, 67, 54, 0.1);
            border: 1px solid rgba(244, 67, 54, 0.3);
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

        @media (max-width: 768px) {
            body { padding: 5px; }
            .container { padding: 5px; }
            .form-card { padding: 15px; margin-bottom: 20px; }
            .form-grid { grid-template-columns: 1fr; gap: 12px; }
            input, select { padding: 10px; font-size: 16px; }
            .submit-btn { padding: 15px; font-size: 16px; }
            table { min-width: 600px; font-size: 11px; }
            th { padding: 10px 6px; font-size: 10px; }
            td { padding: 8px 4px; font-size: 11px; max-width: 80px; }
            .edit-date { width: 100px; padding: 4px; font-size: 10px; }
            .delete-btn { padding: 4px 6px; font-size: 9px; }
            .confirm-delete-btn, .cancel-delete-btn { padding: 3px 5px; font-size: 8px; }
            .stats-container { grid-template-columns: repeat(3, 1fr); gap: 8px; }
            .stat-card { padding: 10px; }
        }

        @media (max-width: 480px) {
            .form-grid { grid-template-columns: 1fr; }
            table { min-width: 500px; }
            th, td { padding: 6px 3px; font-size: 10px; }
            .edit-date { width: 80px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>顧客商品預訂登記系統</h1>
        
        <div class="sync-status">
            <div class="sync-indicator" id="syncIndicator"></div>
            <span id="syncStatus">初始化中...</span>
        </div>

        <div id="errorMessage" class="error-message" style="display: none;"></div>
        
        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-number" id="totalReservations">0</div>
                <div class="stat-label">總預訂數</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="todayReservations">0</div>
                <div class="stat-label">今日預訂</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalQuantity">0</div>
                <div class="stat-label">總數量</div>
            </div>
        </div>

        <div class="form-card">
            <form id="reservationForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="reservationDate">預訂日期</label>
                        <input type="date" id="reservationDate" name="reservationDate" required>
                    </div>
                    <div class="form-group">
                        <label for="customerName">顧客姓名</label>
                        <input type="text" id="customerName" name="customerName" required>
                    </div>
                    <div class="form-group">
                        <label for="contactPlatform">聯絡平台</label>
                        <select id="contactPlatform" name="contactPlatform" required>
                            <option value="" disabled selected>請選擇</option>
                            <option value="臉書">臉書</option>
                            <option value="IG">IG</option>
                            <option value="Google">Google</option>
                            <option value="脆">脆</option>
                            <option value="Line@">Line@</option>
                            <option value="電話">電話</option>
                            <option value="臨店">臨店</option>
                            <option value="其他">其他</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="product">預訂商品</label>
                        <input type="text" id="product" name="product" required>
                    </div>
                    <div class="form-group">
                        <label for="quantity">數量</label>
                        <input type="number" id="quantity" name="quantity" min="1" value="1" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">聯絡電話</label>
                        <input type="tel" id="phone" name="phone" required>
                    </div>
                </div>
                <button type="submit" class="submit-btn" id="submitBtn">新增預訂</button>
            </form>
        </div>

        <h2>預訂記錄</h2>
        <div id="loadingMessage" class="loading">載入中...</div>
        <div class="table-container">
            <table id="reservationTable">
                <thead>
                    <tr>
                        <th class="sortable" data-column="reservationDate">預訂日期</th>
                        <th>顧客姓名</th>
                        <th class="sortable" data-column="contactPlatform">聯絡平台</th>
                        <th class="sortable" data-column="product">預訂商品</th>
                        <th>數量</th>
                        <th>聯絡電話</th>
                        <th>取貨日期</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="reservationList">
                </tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getDatabase, ref, push, set, onValue, remove, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

        const firebaseConfig = {
            apiKey: "AIzaSyBSCAo9bCzDK0p39STACEg6opiKttrNy4I",
            authDomain: "pre-order-registration.firebaseapp.com",
            databaseURL: "https://pre-order-registration-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "pre-order-registration",
            storageBucket: "pre-order-registration.firebasestorage.app",
            messagingSenderId: "211911682667",
            appId: "1:211911682667:web:a8744e7cb96733219e1f2e"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        let reservations = [];
        let sortColumn = '';
        let sortDirection = 'asc';
        let isConnected = false;

        const syncIndicator = document.getElementById('syncIndicator');
        const syncStatus = document.getElementById('syncStatus');
        const errorMessage = document.getElementById('errorMessage');
        const loadingMessage = document.getElementById('loadingMessage');
        const submitBtn = document.getElementById('submitBtn');

        function updateSyncStatus(status, message) {
            syncIndicator.className = `sync-indicator ${status}`;
            syncStatus.textContent = message;
            
            if (status === 'connected') {
                isConnected = true;
                hideError();
                enableControls();
            } else if (status === 'disconnected') {
                isConnected = false;
                showError('連線中斷，請檢查網路連線');
                disableControls();
            }
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }

        function hideError() {
            errorMessage.style.display = 'none';
        }

        function enableControls() {
            submitBtn.disabled = false;
            document.querySelectorAll('.delete-btn').forEach(btn => btn.disabled = false);
            document.querySelectorAll('.edit-date').forEach(input => input.disabled = false);
        }

        function disableControls() {
            submitBtn.disabled = true;
            document.querySelectorAll('.delete-btn').forEach(btn => btn.disabled = true);
            document.querySelectorAll('.edit-date').forEach(input => input.disabled = true);
        }

        function initializeDateInputs() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('reservationDate').value = today;
            
            const maxDate = new Date();
            maxDate.setMonth(maxDate.getMonth() + 3);
            const maxDateString = maxDate.toISOString().split('T')[0];
            
            const minDate = new Date();
            minDate.setMonth(minDate.getMonth() - 3);
            const minDateString = minDate.toISOString().split('T')[0];
            
            document.getElementById('reservationDate').setAttribute('min', minDateString);
            document.getElementById('reservationDate').setAttribute('max', maxDateString);
        }

        function setupFirebaseListener() {
            const reservationsRef = ref(database, 'reservations');
            
            onValue(reservationsRef, (snapshot) => {
                try {
                    updateSyncStatus('connected', '已連線 - 即時同步');
                    loadingMessage.style.display = 'none';
                    
                    const data = snapshot.val();
                    reservations = [];
                    
                    if (data) {
                        Object.keys(data).forEach(key => {
                            reservations.push({
                                firebaseKey: key,
                                ...data[key]
                            });
                        });
                    }
                    
                    migrateLocalData();
                    renderReservations();
                    updateStats();
                } catch (error) {
                    console.error('數據同步錯誤:', error);
                    updateSyncStatus('disconnected', '同步失敗');
                    showError('數據同步失敗，請重新整理頁面');
                }
            }, (error) => {
                console.error('Firebase 連線錯誤:', error);
                updateSyncStatus('disconnected', '連線失敗');
                showError('無法連接到伺服器，請檢查網路連線');
                loadingMessage.style.display = 'none';
            });
        }

        function migrateLocalData() {
            const localData = localStorage.getItem('reservations');
            if (localData && reservations.length === 0) {
                try {
                    const localReservations = JSON.parse(localData);
                    if (localReservations.length > 0) {
                        updateSyncStatus('syncing', '同步本地數據中...');
                        
                        localReservations.forEach(reservation => {
                            const reservationsRef = ref(database, 'reservations');
                            push(reservationsRef, {
                                ...reservation,
                                createdAt: serverTimestamp(),
                                updatedAt: serverTimestamp()
                            });
                        });
                        
                        localStorage.removeItem('reservations');
                    }
                } catch (error) {
                    console.error('本地數據遷移錯誤:', error);
                }
            }
        }

        async function addReservation(reservation) {
            if (!isConnected) {
                showError('目前離線，無法新增預訂');
                return false;
            }

            try {
                updateSyncStatus('syncing', '新增中...');
                
                const reservationsRef = ref(database, 'reservations');
                await push(reservationsRef, {
                    ...reservation,
                    createdAt: serverTimestamp(),
                    updatedAt: serverTimestamp()
                });
                
                return true;
            } catch (error) {
                console.error('新增預訂錯誤:', error);
                showError('新增預訂失敗，請稍後再試');
                updateSyncStatus('disconnected', '新增失敗');
                return false;
            }
        }

        async function updateReservation(firebaseKey, updates) {
            if (!isConnected) {
                showError('目前離線，無法更新');
                return false;
            }

            try {
                const reservationRef = ref(database, `reservations/${firebaseKey}`);
                await set(reservationRef, {
                    ...updates,
                    updatedAt: serverTimestamp()
                });
                return true;
            } catch (error) {
                console.error('更新預訂錯誤:', error);
                showError('更新失敗，請稍後再試');
                return false;
            }
        }

        async function deleteReservation(firebaseKey) {
            if (!isConnected) {
                showError('目前離線，無法刪除');
                return false;
            }

            try {
                updateSyncStatus('syncing', '刪除中...');
                
                const reservationRef = ref(database, `reservations/${firebaseKey}`);
                await remove(reservationRef);
                
                return true;
            } catch (error) {
                console.error('刪除預訂錯誤:', error);
                showError('刪除失敗，請稍後再試');
                updateSyncStatus('disconnected', '刪除失敗');
                return false;
            }
        }

        document.getElementById('reservationForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!isConnected) {
                showError('目前離線，無法新增預訂');
                return;
            }

            const reservationDate = document.getElementById('reservationDate').value;
            const reservation = {
                id: Date.now(),
                reservationDate: reservationDate,
                customerName: document.getElementById('customerName').value,
                contactPlatform: document.getElementById('contactPlatform').value,
                product: document.getElementById('product').value,
                quantity: parseInt(document.getElementById('quantity').value),
                phone: document.getElementById('phone').value,
                pickupDate: reservationDate
            };

            const success = await addReservation(reservation);
            if (success) {
                e.target.reset();
                const today = new Date().toISOString().split('T')[0];
                document.getElementById('reservationDate').value = today;
                document.getElementById('quantity').value = 1;
            }
        });

        function sortReservations(column) {
            if (sortColumn === column) {
                sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                sortColumn = column;
                sortDirection = 'asc';
            }

            reservations.sort((a, b) => {
                let aVal = a[column];
                let bVal = b[column];
                
                if (column === 'reservationDate') {
                    aVal = new Date(aVal);
                    bVal = new Date(bVal);
                } else if (typeof aVal === 'string') {
                    aVal = aVal.toLowerCase();
                    bVal = bVal.toLowerCase();
                }

                return sortDirection === 'asc' ? (aVal > bVal ? 1 : -1) : (aVal < bVal ? 1 : -1);
            });

            updateSortHeaders();
            renderReservations();
        }

        function updateSortHeaders() {
            document.querySelectorAll('.sortable').forEach(th => {
                th.classList.remove('asc', 'desc');
                if (th.dataset.column === sortColumn) {
                    th.classList.add(sortDirection);
                }
            });
        }

        function updateStats() {
            const today = new Date().toISOString().split('T')[0];
            const todayReservations = reservations.filter(r => r.reservationDate === today).length;
            const totalQuantity = reservations.reduce((sum, r) => sum + (r.quantity || 1), 0);

            document.getElementById('totalReservations').textContent = reservations.length;
            document.getElementById('todayReservations').textContent = todayReservations;
            document.getElementById('totalQuantity').textContent = totalQuantity;
        }

        function renderReservations() {
            const reservationList = document.getElementById('reservationList');
            reservationList.innerHTML = '';

            reservations.forEach(reservation => {
                const row = document.createElement('tr');
                const maxDate = new Date();
                maxDate.setMonth(maxDate.getMonth() + 3);
                const maxDateString = maxDate.toISOString().split('T')[0];
                const minPickupDate = reservation.reservationDate;
                
                row.innerHTML = `
                    <td>${reservation.reservationDate}</td>
                    <td>${reservation.customerName}</td>
                    <td>${reservation.contactPlatform}</td>
                    <td>${reservation.product}</td>
                    <td><span class="quantity-display">${reservation.quantity || 1}</span></td>
                    <td>${reservation.phone}</td>
                    <td>
                        <input type="date" class="edit-date" value="${reservation.pickupDate}" 
                               min="${minPickupDate}" max="${maxDateString}" 
                               data-key="${reservation.firebaseKey}">
                    </td>
                    <td>
