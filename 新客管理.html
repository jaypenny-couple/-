<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>顧客管理系統</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #fff;
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    h2 {
      color: #00e6e6;
      margin-bottom: 25px;
      font-size: 28px;
      text-align: center;
      text-shadow: 0 2px 10px rgba(0, 230, 230, 0.3);
    }

    h3 {
      color: #00cccc;
      margin: 30px 0 15px;
      font-size: 20px;
    }

    .form-section {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 25px;
      margin-bottom: 20px;
    }

    .form-group {
      background: rgba(255, 255, 255, 0.08);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid rgba(0, 230, 230, 0.2);
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #00e6e6;
      font-weight: 500;
      font-size: 14px;
    }

    input[type="text"],
    input[type="date"],
    input[type="month"],
    select {
      width: 100%;
      padding: 10px 12px;
      margin-top: 5px;
      border-radius: 8px;
      border: 2px solid rgba(0, 230, 230, 0.3);
      background: rgba(255, 255, 255, 0.95);
      color: #000;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    input[type="text"]:focus,
    input[type="date"]:focus,
    input[type="month"]:focus,
    select:focus {
      outline: none;
      border-color: #00e6e6;
      box-shadow: 0 0 0 3px rgba(0, 230, 230, 0.2);
    }

    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 8px;
    }

    .checkbox-group label {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
      color: #fff;
      font-weight: normal;
    }

    .checkbox-group label:hover {
      background: rgba(0, 230, 230, 0.2);
    }

    .checkbox-group input[type="checkbox"] {
      cursor: pointer;
      width: 16px;
      height: 16px;
    }

    .button-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin: 25px 0;
    }

    button {
      padding: 12px 24px;
      background: linear-gradient(135deg, #00cccc, #00a3a3);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 204, 204, 0.3);
    }

    button:hover {
      background: linear-gradient(135deg, #00a3a3, #008080);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 204, 204, 0.4);
    }

    button:disabled {
      background: #888;
      cursor: not-allowed;
      transform: none;
    }

    .btn-clear {
      background: linear-gradient(135deg, #e74c3c, #c0392b);
    }

    .btn-clear:hover {
      background: linear-gradient(135deg, #c0392b, #a93226);
    }

    .contact-edit-popup {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .contact-edit-content {
      background: white;
      padding: 25px;
      border-radius: 12px;
      max-width: 500px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }

    .contact-edit-content h4 {
      color: #00cccc;
      margin-bottom: 15px;
      font-size: 18px;
    }

    .contact-edit-content .checkbox-group label {
      color: #333;
    }

    .contact-edit-buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .contact-edit-buttons button {
      flex: 1;
    }

    .stats {
      display: flex;
      gap: 20px;
      margin: 20px 0;
      flex-wrap: wrap;
    }

    .stat-card {
      background: rgba(0, 230, 230, 0.15);
      padding: 20px;
      border-radius: 12px;
      border: 2px solid rgba(0, 230, 230, 0.3);
      flex: 1;
      min-width: 150px;
      text-align: center;
    }

    .stat-number {
      font-size: 32px;
      font-weight: bold;
      color: #00e6e6;
    }

    .stat-label {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.8);
    }

    .table-container {
      overflow-x: auto;
      margin-top: 20px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.95);
    }

    table {
      width: 100%;
      min-width: 900px;
      border-collapse: collapse;
      background: white;
      color: #000;
    }

    th {
      background: linear-gradient(135deg, #00cccc, #00a3a3);
      color: white;
      padding: 14px 10px;
      text-align: left;
      font-weight: 600;
    }

    td {
      padding: 12px 10px;
      border-bottom: 1px solid #e0e0e0;
    }

    tr:hover {
      background-color: #f5f5f5;
    }

    td input[type="text"],
    td input[type="date"] {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 13px;
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>💼 顧客管理系統</h2>

    <div style="background: rgba(0, 230, 230, 0.15); padding: 20px; border-radius: 12px; margin-bottom: 20px;">
      <label style="font-size: 18px; color: #00e6e6; margin-bottom: 10px;">選擇設計師</label>
      <select id="currentDesigner" style="font-size: 16px; padding: 12px;">
        <option value="">請選擇設計師</option>
        <option value="JAY">JAY</option>
        <option value="IRIS">IRIS</option>
        <option value="SHERRY">SHERRY</option>
        <option value="CINDY">CINDY</option>
      </select>
    </div>

    <div id="designerSection" style="display: none;">
      <div class="stats">
        <div class="stat-card">
          <div class="stat-number" id="totalRecords">0</div>
          <div class="stat-label">總顧客數</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="thisMonth">0</div>
          <div class="stat-label">本月新增</div>
        </div>
      </div>

    <div class="form-section">
      <div class="form-group">
        <label>顧客姓名 *</label>
        <input type="text" id="name" placeholder="請輸入顧客姓名">

        <label style="margin-top: 15px;">設計師 *</label>
        <input type="text" id="designer" readonly style="background: #e0e0e0;">

        <label style="margin-top: 15px;">消費項目</label>
        <div class="checkbox-group">
          <label><input type="checkbox" name="service" value="剪髮">剪髮</label>
          <label><input type="checkbox" name="service" value="燙髮">燙髮</label>
          <label><input type="checkbox" name="service" value="染髮">染髮</label>
          <label><input type="checkbox" name="service" value="護髮">護髮</label>
          <label><input type="checkbox" name="service" value="頭皮護理">頭皮護理</label>
          <label><input type="checkbox" name="service" value="其他">其他</label>
        </div>
        <input type="text" id="otherService" placeholder="其他服務項目" style="margin-top: 10px;">

        <label style="margin-top: 15px;">購買產品</label>
        <input type="text" id="product" placeholder="購買的產品名稱">
      </div>

      <div class="form-group">
        <label>消費日期</label>
        <input type="date" id="visitDate">

        <label style="margin-top: 15px;">來店原因</label>
        <select id="reason">
          <option value="親友推薦">親友推薦</option>
          <option value="網路">網路</option>
          <option value="路過">路過</option>
        </select>

        <label style="margin-top: 15px;">聯絡日期</label>
        <input type="date" id="contactDate">

        <label style="margin-top: 15px;">聯絡方式</label>
        <div class="checkbox-group">
          <label><input type="checkbox" name="contact" value="市話">市話</label>
          <label><input type="checkbox" name="contact" value="行動電話">行動電話</label>
          <label><input type="checkbox" name="contact" value="簡訊">簡訊</label>
          <label><input type="checkbox" name="contact" value="LINE">LINE</label>
          <label><input type="checkbox" name="contact" value="臉書">臉書</label>
          <label><input type="checkbox" name="contact" value="IG">IG</label>
          <label><input type="checkbox" name="contact" value="當面確認">當面確認</label>
          <label><input type="checkbox" name="contact" value="介紹人確認">介紹人確認</label>
        </div>

        <label style="margin-top: 15px;">訪問結果</label>
        <input type="text" id="result" placeholder="訪問後的結果記錄">

        <label style="margin-top: 15px;">是否回店</label>
        <select id="returned">
          <option value="">請選擇</option>
          <option value="是">是</option>
          <option value="否">否</option>
        </select>
      </div>
    </div>

    <div class="button-group">
      <button id="addBtn">✓ 登錄資料</button>
      <button class="btn-clear" id="clearBtn">✗ 清除表單</button>
      <button id="exportBtn">📥 匯出CSV</button>
    </div>

    <hr style="border: none; border-top: 2px solid rgba(0, 230, 230, 0.2); margin: 30px 0;">

    <div style="background: rgba(255, 255, 255, 0.08); padding: 20px; border-radius: 12px; margin: 20px 0;">
      <h3>🔍 搜尋篩選</h3>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 15px;">
        <div>
          <label>服務項目</label>
          <input type="text" id="searchService" placeholder="例：燙髮">
        </div>
        <div>
          <label>月份</label>
          <input type="month" id="searchMonth">
        </div>
        <div>
          <label>來店原因</label>
          <select id="searchReason">
            <option value="">全部</option>
            <option value="親友推薦">親友推薦</option>
            <option value="網路">網路</option>
            <option value="路過">路過</option>
          </select>
        </div>
      </div>
      <div class="button-group">
        <button id="searchBtn">🔍 搜尋</button>
        <button id="showAllBtn">📋 顯示全部</button>
      </div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>顧客姓名</th>
            <th>設計師</th>
            <th>消費項目</th>
            <th>購買產品</th>
            <th>消費日期</th>
            <th>聯絡日期</th>
            <th>聯絡方式</th>
            <th>來店原因</th>
            <th>訪問結果</th>
            <th>是否回店</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="11" style="text-align: center; padding: 20px; color: #00e6e6;">載入中...</td></tr>
        </tbody>
      </table>
    </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
    import { getDatabase, ref, set, update, remove, onValue } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-database.js";

    const app = initializeApp({
      apiKey: "AIzaSyAuKPbvzmLv7H8gTIADUugGMGCOrlKJL7I",
      authDomain: "new-customer-management-system.firebaseapp.com",
      databaseURL: "https://new-customer-management-system-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "new-customer-management-system",
      storageBucket: "new-customer-management-system.firebasestorage.app",
      messagingSenderId: "519659942601",
      appId: "1:519659942601:web:6e0c257d6b30d120b39318"
    });

    const db = getDatabase(app);
    let allData = [];
    let currentDesigner = '';

    // 載入資料
    function loadData() {
      onValue(ref(db, 'records'), (snap) => {
        allData = [];
        if (snap.exists()) {
          Object.entries(snap.val()).forEach(([k, v]) => {
            allData.push({...v, id: k});
          });
        }
        if (currentDesigner) {
          renderTable();
        }
      });
    }

    // 渲染表格
    function renderTable(filteredData = null) {
      const data = filteredData || allData.filter(r => r.designer === currentDesigner);
      const tbody = document.getElementById('tableBody');
      
      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="11" class="empty-state">尚無資料</td></tr>';
        document.getElementById('totalRecords').textContent = '0';
        document.getElementById('thisMonth').textContent = '0';
        return;
      }

      // 更新統計
      const now = new Date();
      const month = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
      document.getElementById('totalRecords').textContent = data.length;
      document.getElementById('thisMonth').textContent = data.filter(r => r.visitDate?.startsWith(month)).length;

      // 渲染表格內容
      tbody.innerHTML = data.map(r => `
        <tr>
          <td>${escapeHtml(r.name)}</td>
          <td>${escapeHtml(r.designer)}</td>
          <td>${escapeHtml(r.services || '')}</td>
          <td>${escapeHtml(r.product || '')}</td>
          <td>${r.visitDate || '-'}</td>
          <td><input type="date" value="${r.contactDate || ''}" data-id="${r.id}" data-field="contactDate"></td>
          <td><button data-id="${r.id}" data-contact="${escapeHtml(r.contact || '')}" class="contact-btn" style="padding: 6px 12px; font-size: 12px; background: #00a3a3; width: 100%; cursor: pointer; color: white; border: none; border-radius: 4px;">${escapeHtml(r.contact) || '選擇'}</button></td>
          <td>${escapeHtml(r.reason || '')}</td>
          <td><input type="text" value="${escapeHtml(r.result || '')}" data-id="${r.id}" data-field="result"></td>
          <td>
            <select data-id="${r.id}" data-field="returned" style="width: 100%; padding: 6px 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px;">
              <option value="" ${!r.returned ? 'selected' : ''}>請選擇</option>
              <option value="是" ${r.returned === '是' ? 'selected' : ''}>是</option>
              <option value="否" ${r.returned === '否' ? 'selected' : ''}>否</option>
            </select>
          </td>
          <td><button data-id="${r.id}" class="del-btn" style="padding: 6px 12px; font-size: 12px; background: #e74c3c; cursor: pointer; color: white; border: none; border-radius: 4px;">刪除</button></td>
        </tr>
      `).join('');

      // 綁定表格內的事件
      tbody.querySelectorAll('input[data-field], select[data-field]').forEach(inp => {
        inp.addEventListener('change', () => {
          update(ref(db, 'records/' + inp.dataset.id), {[inp.dataset.field]: inp.value});
        });
      });

      tbody.querySelectorAll('.contact-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          openContactEdit(btn.dataset.id, btn.dataset.contact);
        });
      });

      tbody.querySelectorAll('.del-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          if (confirm('確定要刪除此筆資料嗎?')) {
            remove(ref(db, 'records/' + btn.dataset.id));
          }
        });
      });
    }

    // HTML 轉義
    function escapeHtml(txt) {
      const d = document.createElement('div');
      d.textContent = txt;
      return d.innerHTML;
    }

    // 開啟聯絡方式編輯視窗
    function openContactEdit(id, current) {
      const opts = ['市話', '行動電話', '簡訊', 'LINE', '臉書', 'IG', '當面確認', '介紹人確認'];
      const selected = current ? current.split(', ').filter(s => s) : [];
      
      const popup = document.createElement('div');
      popup.className = 'contact-edit-popup';
      popup.innerHTML = `
        <div class="contact-edit-content">
          <h4>編輯聯絡方式</h4>
          <div class="checkbox-group">
            ${opts.map(o => `
              <label>
                <input type="checkbox" value="${o}" ${selected.includes(o) ? 'checked' : ''}>
                ${o}
              </label>
            `).join('')}
          </div>
          <div class="contact-edit-buttons">
            <button class="save-btn">✓ 確認</button>
            <button class="btn-clear cancel-btn">✗ 取消</button>
          </div>
        </div>
      `;
      
      popup.addEventListener('click', (e) => {
        if (e.target === popup) popup.remove();
      });

      popup.querySelector('.save-btn').addEventListener('click', () => {
        const checked = [...popup.querySelectorAll('input:checked')].map(c => c.value);
        update(ref(db, 'records/' + id), {contact: checked.join(', ')});
        popup.remove();
      });

      popup.querySelector('.cancel-btn').addEventListener('click', () => popup.remove());
      
      document.body.appendChild(popup);
    }

    // 設計師選擇
    document.getElementById('currentDesigner').addEventListener('change', (e) => {
      currentDesigner = e.target.value;
      if (currentDesigner) {
        document.getElementById('designerSection').style.display = 'block';
        document.getElementById('designer').value = currentDesigner;
        renderTable();
      } else {
        document.getElementById('designerSection').style.display = 'none';
      }
    });

    // 新增資料
    document.getElementById('addBtn').addEventListener('click', async () => {
      if (!currentDesigner) {
        alert('請先選擇設計師');
        return;
      }
      
      const name = document.getElementById('name').value.trim();
      if (!name) {
        alert('請輸入顧客姓名');
        return;
      }

      const services = [...document.querySelectorAll('input[name="service"]:checked')].map(c => c.value);
      if (services.includes('其他')) {
        const other = document.getElementById('otherService').value.trim();
        if (other) services.push(other);
      }

      const contacts = [...document.querySelectorAll('input[name="contact"]:checked')].map(c => c.value);

      const btn = document.getElementById('addBtn');
      btn.disabled = true;
      btn.textContent = '登錄中...';

      try {
        await set(ref(db, 'records/' + Date.now()), {
          name,
          designer: currentDesigner,
          services: services.join(', '),
          product: document.getElementById('product').value.trim(),
          visitDate: document.getElementById('visitDate').value,
          contactDate: document.getElementById('contactDate').value,
          contact: contacts.join(', '),
          reason: document.getElementById('reason').value,
          result: document.getElementById('result').value.trim(),
          returned: document.getElementById('returned').value,
          createdAt: new Date().toISOString()
        });
        
        // 清空表單
        document.getElementById('name').value = '';
        document.getElementById('otherService').value = '';
        document.getElementById('product').value = '';
        document.getElementById('visitDate').value = '';
        document.getElementById('contactDate').value = '';
        document.getElementById('result').value = '';
        document.getElementById('returned').value = '';
        document.querySelectorAll('input[name="service"], input[name="contact"]').forEach(c => c.checked = false);
        
        alert('資料登錄成功！');
      } catch (err) {
        console.error(err);
        alert('登錄失敗，請稍後再試');
      } finally {
        btn.disabled = false;
        btn.textContent = '✓ 登錄資料';
      }
    });

    // 清除表單
    document.getElementById('clearBtn').addEventListener('click', () => {
      document.getElementById('name').value = '';
      document.getElementById('otherService').value = '';
      document.getElementById('product').value = '';
      document.getElementById('visitDate').value = '';
      document.getElementById('contactDate').value = '';
      document.getElementById('result').value = '';
      document.getElementById('returned').value = '';
      document.querySelectorAll('input[name="service"], input[name="contact"]').forEach(c => c.checked = false);
    });

    // 搜尋
    document.getElementById('searchBtn').addEventListener('click', () => {
      if (!currentDesigner) return;
      
      const svc = document.getElementById('searchService').value.trim().toLowerCase();
      const mon = document.getElementById('searchMonth').value;
      const rsn = document.getElementById('searchReason').value;

      const filtered = allData.filter(r => 
        r.designer === currentDesigner &&
        (!svc || (r.services && r.services.toLowerCase().includes(svc))) &&
        (!mon || (r.visitDate && r.visitDate.startsWith(mon))) &&
        (!rsn || r.reason === rsn)
      );

      renderTable(filtered);
    });

    // 顯示全部
    document.getElementById('showAllBtn').addEventListener('click', () => {
      document.getElementById('searchService').value = '';
      document.getElementById('searchMonth').value = '';
      document.getElementById('searchReason').value = '';
      renderTable();
    });

    // 匯出CSV
    document.getElementById('exportBtn').addEventListener('click', () => {
      if (!currentDesigner) {
        alert('請先選擇設計師');
        return;
      }
      
      const data = allData.filter(r => r.designer === currentDesigner);
      if (data.length === 0) {
        alert('目前沒有資料可以匯出');
        return;
      }

      const csv = '\uFEFF' + 
        '顧客姓名,設計師,消費項目,購買產品,消費日期,聯絡日期,聯絡方式,來店原因,訪問結果,是否回店\n' +
        data.map(r => [
          r.name, r.designer, r.services, r.product, r.visitDate, 
          r.contactDate, r.contact, r.reason, r.result, r.returned
        ].map(v => `"${String(v || '').replace(/"/g, '""')}"`).join(',')).join('\n');

      const blob = new Blob([csv], {type: 'text/csv;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `顧客資料_${currentDesigner}_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    });

    // 初始化
    loadData();
  </script>
</body>
</html>
