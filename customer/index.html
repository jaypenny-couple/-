<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <title>顧客資料表單維護中｜ALICE Hair Salon</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
      padding: 24px;
      color: #2b2926;
      background: #f7f2ea;
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    }
    main {
      width: min(100%, 520px);
      padding: clamp(32px, 7vw, 56px);
      border: 1px solid rgba(164, 125, 67, .25);
      border-radius: 12px;
      background: #fffaf4;
      box-shadow: 0 20px 60px rgba(54, 43, 31, .1);
      text-align: center;
    }
    p { margin: 0; line-height: 1.85; }
    .eyebrow {
      margin-bottom: 14px;
      color: #a47d43;
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .12em;
    }
    h1 { margin: 0 0 16px; font-size: clamp(1.6rem, 6vw, 2.2rem); line-height: 1.35; }
    .copy { color: #6b6259; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      margin-top: 28px;
      padding: 0 20px;
      border-radius: 7px;
      color: #fff;
      background: #262626;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">ALICE HAIR SALON</p>
    <h1>顧客資料表單暫時維護中</h1>
    <p class="copy">為提升資料保護措施，線上填寫功能目前暫停使用。請由現場人員協助完成資料登記，謝謝您的理解。</p>
    <a href="../index.html">返回 ALICE 官網</a>
  </main>
</body>
</html>
